name: CI/CD — Conecta Comunidade

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  testes:
    name: Testes automatizados
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verificação de sintaxe
        run: for f in $(find src scripts public/js -name '*.js'); do node --check "$f"; done
      - name: Rodar testes (unitários + integração)
        run: npm run test:ci
      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-node-${{ matrix.node }}
          path: test-results.xml

  dados:
    name: Pipeline de dados (bronze → prata → ouro)
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gerar histórico e rodar o ETL
        run: rm -rf datalake/bronze datalake/prata && npm run dados
      - name: Checar qualidade mínima (>= 95% dos registros aproveitados)
        run: node -e "const q=require('./datalake/ouro/_qualidade.json'); console.log(q); if(q.taxaAproveitamento<95) process.exit(1)"
      - name: Publicar camada ouro e relatório de qualidade
        uses: actions/upload-artifact@v4
        with:
          name: datalake-ouro
          path: |
            datalake/ouro
            datalake/quarentena

  docker:
    name: Build da imagem + smoke test
    needs: [testes, dados]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (o estágio de testes roda dentro do Dockerfile)
        run: docker build -t conecta-comunidade:${{ github.sha }} .
      - name: Subir container
        run: |
          docker run -d --name conecta -p 3000:3000 \
            -e NODE_ENV=production \
            -e ADMIN_PASSWORD_HASH="$(node scripts/gerar-hash.js 'senha-do-pipeline-ci')" \
            -e TOKEN_SECRET="${{ github.run_id }}-segredo" \
            -e IOT_DEVICE_KEY="chave-ci" \
            -e PSEUDONIMO_SECRET="pseudonimo-ci" \
            conecta-comunidade:${{ github.sha }}
          for i in $(seq 1 20); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' conecta)" = "healthy" ] && break
            sleep 2
          done
          docker inspect -f 'Status de saúde: {{.State.Health.Status}}' conecta
      - name: Smoke test
        run: BASE_URL=http://localhost:3000 node scripts/smoke.js
      - name: Logs do container
        if: always()
        run: docker logs conecta

  # Entrega contínua: publica a imagem no GitHub Container Registry quando entra na main
  publicar:
    name: Publicar imagem (main)
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push
        run: |
          IMG=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build -t $IMG:latest -t $IMG:${{ github.sha }} .
          docker push $IMG --all-tags
